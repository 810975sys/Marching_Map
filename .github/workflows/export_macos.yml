name: Build and Release PyQt6 App for macOS

on:
  # 手动触发，方便你随时打包
  workflow_dispatch:
  # 可选：当你推送一个 'v*' 标签时自动触发
  # push:
  #   tags:
  #     - 'v*'

jobs:
  build-macos:
    # 指定在最新的 macOS 虚拟机上运行
    runs-on: macos-latest

    steps:
      # 1. 拉取你的代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' # 选择与你本地开发一致的 Python 版本

      # 3. 安装项目依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 pyinstaller
          # 如果你的项目有 requirements.txt，可以用下面这行代替
          # pip install -r requirements.txt

      # 4. 使用 PyInstaller 进行打包
      - name: Build with PyInstaller
        run: |
          pyinstaller --windowed \
                      --name "MarchingMap" \
                      --add-data "fields:fields" \
                      --add-data "saves:saves" \
                      run.py
          # 注意: macOS 下的 --add-data 路径分隔符是冒号 ':'
          # 替换 "path/to/your/icon.icns" 为你的 .icns 图标路径，没有可删除此行。

      # 5. 打包 .app 为 .zip 文件（方便下载）
      - name: Zip the macOS .app
        run: |
          cd dist
          zip -r MarchingMap_macOS.zip MarchingMap.app

      # 6. 将构建好的 zip 文件上传为工作流产物 (Artifact)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarchingMap_macOS
          path: dist/MarchingMap_macOS.zip
